name: Submit an existing iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: EAS ID of the finished iOS production build to upload

jobs:
  submit_ios:
    name: Upload selected iOS build to TestFlight
    type: submit
    params:
      build_id: ${{ inputs.build_id }}
      profile: production
