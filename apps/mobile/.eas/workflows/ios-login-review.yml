name: Verify and upload BeanMora iOS login fix

on:
  workflow_dispatch: {}
  push:
    branches:
      - release/ios-login-review-2026-11-22

defaults:
  image: sdk-57
  tools:
    node: '22.16.0'

jobs:
  build_ios:
    name: Build checked BeanMora iOS candidate
    type: build
    environment: production
    runs_on: macos-medium
    params:
      platform: ios
      profile: production
    hooks:
      before_install_node_modules:
        - name: Verify BeanMora identity and release destination
          run: |
            node --input-type=module <<'NODE'
            import { readFileSync } from 'node:fs';
            import { checkBuildConfig } from './scripts/check-build-config.mjs';
            const { expo } = JSON.parse(readFileSync('./app.json', 'utf8'));
            const eas = JSON.parse(readFileSync('./eas.json', 'utf8'));
            const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
            if (expo.owner !== 'elqallaf09' || expo.slug !== 'beanmora-mobile'
              || expo.extra?.eas?.projectId !== 'a3785113-b993-49fa-9986-e3dc96d63115'
              || expo.ios?.bundleIdentifier !== 'com.beanmora.mobile'
              || eas.submit?.production?.ios?.ascAppId !== '6819935215') {
              throw new Error('App Store candidate must target the existing BeanMora app only.');
            }
            if (expo.version !== '0.5.45' || pkg.version !== expo.version) {
              throw new Error('This release requires matching BeanMora 0.5.45 source versions.');
            }
            if (eas.cli?.appVersionSource !== 'remote'
              || eas.build?.production?.autoIncrement !== true
              || eas.build?.production?.distribution === 'internal'
              || eas.build?.production?.ios?.simulator === true) {
              throw new Error('A store build with remote auto-incremented numbering is required.');
            }
            if (process.env.EXPO_PUBLIC_SUPABASE_URL !== 'https://ubvzdglrwkkuaigmkjap.supabase.co') {
              throw new Error('BeanMora releases must use the BeanMora Supabase project.');
            }
            const issues = checkBuildConfig(process.env);
            if (issues.length) throw new Error(issues.join('\n'));
            console.log('BeanMora app identity, version, build profile and public configuration passed.');
            NODE
        - name: Reproducible npm resolver
          run: npm install --global npm@11.19.1 --ignore-scripts
      after_install_node_modules:
        - name: Verify installed security backports
          run: npm run verify:tooling-security
        - name: Enforce full audit with verified installed security backports
          run: node scripts/audit-dependencies.mjs
        - name: Check mobile TypeScript
          run: npm run typecheck
        - name: Run mobile regression checks
          run: npm test
        - name: Record actual Apple build toolchain
          run: |
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version

  devices:
    name: Select installed iPhone and iPad simulators
    runs_on: macos-medium
    outputs:
      iphone: ${{ steps.choose.outputs.iphone }}
      ipad: ${{ steps.choose.outputs.ipad }}
      runtime: ${{ steps.choose.outputs.runtime }}
    steps:
      - id: choose
        run: |
          xcrun simctl list devices available --json > /tmp/beanmora-devices.json
          node <<'NODE'
          const fs = require('fs');
          const { devices } = JSON.parse(fs.readFileSync('/tmp/beanmora-devices.json', 'utf8'));
          const runtime = Object.keys(devices).filter(k => k.includes('.iOS-')).sort((a,b) => b.localeCompare(a, undefined, {numeric:true})).find(k => devices[k].some(d=>d.isAvailable && d.name.startsWith('iPhone')) && devices[k].some(d=>d.isAvailable && d.name.startsWith('iPad')));
          if (!runtime) throw Error('No runtime contains both iPhone and iPad simulators.');
          const available = devices[runtime].filter(d=>d.isAvailable);
          const iphone = available.find(d=>d.name === 'iPhone 17 Pro') || available.find(d=>d.name.startsWith('iPhone'));
          const ipad = available.find(d=>d.name === 'iPad Air 11-inch (M3)') || available.find(d=>d.name.includes('iPad Air 11')) || available.find(d=>d.name.startsWith('iPad'));
          for (const [key, value] of Object.entries({iphone:iphone.name,ipad:ipad.name,runtime})) fs.writeFileSync('/tmp/beanmora-'+key, value);
          console.log(JSON.stringify({iphone:iphone.name,ipad:ipad.name,runtime}));
          NODE
          set-output iphone "$(cat /tmp/beanmora-iphone)"
          set-output ipad "$(cat /tmp/beanmora-ipad)"
          set-output runtime "$(cat /tmp/beanmora-runtime)"
  build_simulator:
    name: Build reviewed 0.5.45 application for Simulator
    type: build
    environment: production
    runs_on: macos-medium
    params:
      platform: ios
      profile: navigation-test
    hooks:
      before_install_node_modules:
        - name: Check candidate identity and public production destination
          run: |
            node --input-type=module <<'NODE'
            import { readFileSync } from 'node:fs';
            const { expo } = JSON.parse(readFileSync('app.json', 'utf8'));
            if (expo.version !== '0.5.45' || expo.ios.bundleIdentifier !== 'com.beanmora.mobile' || process.env.EXPO_PUBLIC_SUPABASE_URL !== 'https://ubvzdglrwkkuaigmkjap.supabase.co') throw Error('Unexpected candidate or catalog destination');
            NODE
        - name: Reproducible npm resolver
          run: npm install --global npm@11.19.1 --ignore-scripts
  ipad:
    name: Check login and guest access on iPad Simulator
    type: maestro
    image: sdk-57
    environment: production
    runs_on: macos-medium
    needs: [build_simulator, devices]
    params:
      build_id: ${{ needs.build_simulator.outputs.build_id }}
      device_identifier: ${{ needs.devices.outputs.ipad }}
      flow_path: .maestro/ios-login-review.yaml
      record_screen: true
      retries: 0

  submit_ios:
    name: Upload this exact build to App Store Connect
    type: submit
    needs:
      - build_ios
      - ipad
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
