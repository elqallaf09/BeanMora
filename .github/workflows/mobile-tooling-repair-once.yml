name: One-time mobile tooling repair
on:
  pull_request:
    paths: ['.github/workflows/mobile-tooling-repair-once.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/expo-go-mobile-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Patch only the vulnerable tooling leaf
        working-directory: apps/mobile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = {...p.overrides, xcode: {uuid: '11.1.1'}};
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=low
          node -e "const x=require('xcode').project('tooling-smoke.pbxproj'); x.hash={project:{objects:{}}}; const id=x.generateUuid(); if(!/^[A-F0-9]{24}$/.test(id)) throw Error('xcode UUID compatibility failed'); console.log('xcode generateUuid compatible with patched uuid');"
      - name: Commit only reviewed dependency manifests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin feat/expo-go-mobile-preview
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package.json apps/mobile/package-lock.json
          git diff --cached --quiet || git commit -m 'fix(mobile): pin patched xcode uuid dependency and verified lockfile'
          git push origin HEAD:refs/heads/feat/expo-go-mobile-preview
