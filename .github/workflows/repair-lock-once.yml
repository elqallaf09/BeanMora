name: One-time lockfile repair
on:
  pull_request:
    paths: ['.github/workflows/repair-lock-once.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/atomic-brew-outcomes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atomic-brew-outcomes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile missing entries without running package scripts
        run: |
          cp package-lock.json /tmp/beanmora-lock-before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --stat
          git diff -- package-lock.json
      - name: Guard against unrelated dependency upgrades
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('/tmp/beanmora-lock-before.json'));
          const b = JSON.parse(fs.readFileSync('package-lock.json'));
          const changes = [];
          for (const [path, entry] of Object.entries(a.packages)) {
            if (path && (!b.packages[path] || b.packages[path].version !== entry.version)) changes.push({path, before:entry.version, after:b.packages[path]?.version});
          }
          console.log(JSON.stringify({changedExistingVersions:changes, added:Object.keys(b.packages).filter(p => !a.packages[p])}, null, 2));
          if (changes.length) throw new Error('Unexpected existing dependency change: inspect before committing');
          NODE
      - name: Commit the lockfile only, with normal fast-forward protection
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: reconcile missing package lock entries'
          git push origin HEAD:feat/atomic-brew-outcomes
