name: Expo mobile checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    # Match the locked Playwright version and reuse the web workflow's browser image.
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://mobilefixture.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_isolated_test_fixture
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci
      - name: Security exploit, backport integrity and audit policy regressions
        run: node --test scripts/tooling-security.test.mjs scripts/audit-policy.test.mjs scripts/check-exported-dependencies.test.mjs
      - name: Enforce full audit with verified installed security backports
        run: node scripts/audit-dependencies.mjs
      - name: Patched Xcode tooling compatibility
        run: node scripts/check-tooling.cjs
      - run: npm run typecheck
      - run: npm test
      - name: Expo dependency compatibility
        run: npx expo install --check
      - run: npx expo-doctor@1.20.4
      - name: Bundle iOS, Android and web
        run: npm run export -- --source-maps
      - name: Keep security-patched build tooling out of every runtime bundle
        run: node scripts/check-exported-dependencies.mjs
      - name: Verify preinstalled web-preview browser
        run: node -e "const fs=require('node:fs'); const {chromium}=require('@playwright/test'); fs.accessSync(chromium.executablePath(),fs.constants.X_OK)"
      - name: Test React Native Web preview (not a physical-device test)
        run: npx playwright test --config=playwright.config.ts
