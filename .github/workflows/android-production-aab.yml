name: Android production AAB (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beanmora-android-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run mobile checks
        run: npm test
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: Queue production Android App Bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN as a GitHub Actions repository secret before running this workflow."
            exit 1
          fi
          eas build --platform android --profile production --non-interactive --no-wait
