name: One-time security dependency update
on:
  push:
    branches: [fix/security-release-hardening]
    paths: [.github/workflows/security-upgrade-once.yml]
permissions:
  contents: read
jobs:
  update-lock:
    if: github.repository == 'elqallaf09/BeanMora' && github.ref == 'refs/heads/fix/security-release-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update npm resolver (npm 10 crashes on optional peer graph)
        run: npm install --global npm@11 --ignore-scripts --loglevel=error
      - name: Resolve patched versions without lifecycle scripts
        run: |
          npm --version
          node <<'JS'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          Object.assign(p.dependencies,{'next':'15.5.25','react':'19.1.5','react-dom':'19.1.5','@supabase/ssr':'0.6.1','@supabase/supabase-js':'2.57.4'});
          Object.assign(p.devDependencies,{'eslint-config-next':'15.5.25','vitest':'4.1.11','@vitest/ui':'4.1.11','@playwright/test':'1.55.1'});
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          fs.unlinkSync('package-lock.json');
          JS
          npm install --package-lock-only --ignore-scripts --loglevel=error
          npm audit --json > /tmp/after.json || true
          node -e 'const a=require("/tmp/after.json"); if(a.error) throw Error(JSON.stringify(a.error)); console.log("AFTER",JSON.stringify(a.metadata)); for(const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n,v.severity,JSON.stringify(v.fixAvailable),JSON.stringify(v.via));'
          node -e 'const p=require("./package-lock.json"); for(const n of Object.keys({...p.packages[""].dependencies,...p.packages[""].devDependencies})) console.log("RESOLVED",n,p.packages["node_modules/"+n]?.version);'
      - name: Commit only manifests on the expected branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: update patched dependencies and regenerate compatible lock'
          BASIC=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $BASIC" push origin HEAD:refs/heads/fix/security-release-hardening
