name: One-time security dependency update
on:
  push:
    branches: [fix/security-release-hardening]
    paths: [.github/workflows/security-upgrade-once.yml]
permissions:
  contents: read
jobs:
  update-lock:
    if: github.repository == 'elqallaf09/BeanMora' && github.ref == 'refs/heads/fix/security-release-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit baseline
        run: |
          npm audit --json > /tmp/before.json || true
          node -e 'const a=require("/tmp/before.json"); if(a.error) throw Error(JSON.stringify(a.error)); console.log("BEFORE",JSON.stringify(a.metadata)); for(const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n,v.severity,JSON.stringify(v.fixAvailable),JSON.stringify(v.via.filter(x=>typeof x!=="string").map(x=>({title:x.title,url:x.url,range:x.range}))));'
      - name: Install explicit patched versions into lockfile only
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@15.5.24 react@19.1.5 react-dom@19.1.5
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@15.5.24 vitest@4.1.11 @vitest/ui@4.1.11
          npm audit --json > /tmp/after.json || true
          node -e 'const a=require("/tmp/after.json"); if(a.error) throw Error(JSON.stringify(a.error)); console.log("AFTER",JSON.stringify(a.metadata)); for(const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n,v.severity,JSON.stringify(v.fixAvailable),JSON.stringify(v.via.filter(x=>typeof x!=="string").map(x=>({title:x.title,url:x.url,range:x.range}))));'
      - name: Commit only manifests on the expected branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: patch Next React and Vitest security dependencies'
          BASIC=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $BASIC" push origin HEAD:refs/heads/fix/security-release-hardening
