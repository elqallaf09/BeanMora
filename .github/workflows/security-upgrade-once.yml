name: One-time security dependency update
on:
  push:
    branches: [fix/security-release-hardening]
    paths: [.github/workflows/security-upgrade-once.yml]
permissions:
  contents: read
jobs:
  update-lock:
    if: github.repository == 'elqallaf09/BeanMora' && github.ref == 'refs/heads/fix/security-release-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1 --ignore-scripts --loglevel=error
      - name: Pin resolved versions and narrowly patch Next PostCSS
        run: |
          node <<'JS'
          const fs=require('fs');const p=require('./package.json');const lock=require('./package-lock.json');
          for(const group of ['dependencies','devDependencies']) for(const n of Object.keys(p[group])) {
            const v=lock.packages['node_modules/'+n]?.version;
            if(!v) throw Error('Missing locked dependency '+n);
            p[group][n]=v;
          }
          p.overrides={...p.overrides,next:{postcss:'8.5.23'}};
          p.packageManager='npm@11.19.1';
          p.engines={node:'>=22.16.0'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          npm install --package-lock-only --ignore-scripts --loglevel=error
          npm audit --json > /tmp/after.json || true
          node -e 'const a=require("/tmp/after.json"); if(a.error) throw Error(JSON.stringify(a.error)); console.log("FINAL_AUDIT",JSON.stringify(a.metadata)); for(const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n,v.severity,JSON.stringify(v.via));'
      - name: Commit only manifests on the expected branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: pin dependency versions and override vulnerable Next PostCSS'
          BASIC=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $BASIC" push origin HEAD:refs/heads/fix/security-release-hardening
