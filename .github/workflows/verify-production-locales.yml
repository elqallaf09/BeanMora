name: Verify released 0.5.35 locales
on:
  push:
    branches: [verify/0.5.35-live-locales]
permissions:
  contents: read
jobs:
  live_public_locales:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproducible npm resolver
        run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Install locked mobile verification dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Verify checked production source and all eight public locale flows
        run: node scripts/verify-production-locales.cjs
      - name: Preserve verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-locale-verification
          path: live-verification.json
          retention-days: 7
