name: Prepare BeanMora Expo patch once
on:
  push:
    branches: [fix/beanmora-contact-support-2026-10-15]
    paths: [.github/workflows/beanmora-expo-patch-once.yml]
permissions:
  contents: read
jobs:
  patch:
    if: github.repository == 'elqallaf09/BeanMora'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://mobilefixture.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_isolated_test_fixture
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Update only the explicitly requested SDK patch
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.expo!=='57.0.29') throw Error('Unexpected Expo version; inspect before updating');"
          npm install --package-lock-only --ignore-scripts --save-exact expo@57.0.30
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const before=JSON.parse(execFileSync('git',['show','HEAD:apps/mobile/package.json'],{encoding:'utf8'}));
          const after=JSON.parse(readFileSync('package.json','utf8'));
          before.dependencies.expo='57.0.30';
          assert.deepEqual(after,before,'Unexpected direct dependency or script change');
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          assert.equal(lock.packages[''].dependencies.expo,'57.0.30');
          assert.equal(lock.packages['node_modules/expo'].version,'57.0.30');
          for (const path of execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n')) {
            assert.ok(['apps/mobile/package.json','apps/mobile/package-lock.json'].includes(path),`Unexpected file: ${path}`);
          }
          NODE
      - run: npm ci
      - name: Preserve installed-code security verification
        run: |
          node --test scripts/tooling-security.test.mjs scripts/audit-policy.test.mjs scripts/check-exported-dependencies.test.mjs
          node scripts/audit-dependencies.mjs
          node scripts/check-tooling.cjs
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
      - run: npx expo-doctor@1.20.4
      - name: Commit only the two verified dependency files to the same PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const repo='elqallaf09/BeanMora';
          const branch='fix/beanmora-contact-support-2026-10-15';
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.GITHUB_REF,`refs/heads/${branch}`);
          const parent=process.env.GITHUB_SHA;
          assert.match(parent,/^[0-9a-f]{40}$/);
          async function api(path,method='GET',body) {
            const response=await fetch(`https://api.github.com/repos/${repo}/${path}`,{
              method, headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
              ...(body===undefined?{}:{body:JSON.stringify(body)})
            });
            if(!response.ok) throw new Error(`${method} ${path} failed (${response.status}): ${await response.text()}`);
            return response.json();
          }
          const ref=await api(`git/ref/heads/${branch}`);
          assert.equal(ref.object.sha,parent,'PR branch moved; refusing to overwrite');
          const commit=await api(`git/commits/${parent}`);
          const tree=await api('git/trees','POST',{base_tree:commit.tree.sha,tree:['package.json','package-lock.json'].map(name=>({path:`apps/mobile/${name}`,mode:'100644',type:'blob',content:readFileSync(name,'utf8')}))});
          const next=await api('git/commits','POST',{message:'fix: align BeanMora with Expo 57.0.30 and verified lockfile',tree:tree.sha,parents:[parent]});
          await api(`git/refs/heads/${branch}`,'PATCH',{sha:next.sha,force:false});
          console.log(`Verified dependency commit: ${next.sha}`);
          NODE
