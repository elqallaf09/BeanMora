name: One-time Expo lockfile bootstrap
on:
  pull_request:
    paths: ['apps/mobile/package.json', '.github/workflows/mobile-bootstrap-once.yml']
permissions:
  contents: read
jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/expo-go-mobile-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Resolve SDK-compatible public npm packages
        working-directory: apps/mobile
        env:
          CI: '1'
        run: |
          npm install --ignore-scripts
          npx expo install --fix
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(p[section] || {})) {
              const resolved = lock.packages['node_modules/' + name]?.version;
              if (!resolved || /[a-z]/i.test(resolved)) throw new Error('Missing or prerelease: ' + name);
              p[section][name] = resolved;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit only the mobile dependency manifests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin feat/expo-go-mobile-preview
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package.json apps/mobile/package-lock.json
          git diff --cached --quiet || git commit -m 'build(mobile): pin Expo-compatible packages and commit lockfile'
          git push origin HEAD:refs/heads/feat/expo-go-mobile-preview
